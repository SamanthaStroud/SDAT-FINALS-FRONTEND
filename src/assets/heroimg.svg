    <tspan fill="#e2e8f0">console.</tspan><tspan fill="#60a5fa">log</tspan><tspan fill="#e2e8f0">(sorted);</tspan>
    <tspan fill="#4a3570">   // [1, 1, 3, 4, 5]</tspan>
