  <text x="140" y="157" font-family="'Courier New', Courier, monospace" font-size="11" fill="#4a3570">// JavaScript Arrays — Study Script</text>

  <!-- Line 2: blank -->

  <!-- Line 3 -->
  <text x="140" y="193" font-family="'Courier New', Courier, monospace" font-size="11">
    <tspan fill="#c084fc">const </tspan><tspan fill="#e2e8f0">fruits </tspan><tspan fill="#7dd3fc">= </tspan><tspan fill="#fbbf24">[</tspan><tspan fill="#86efac">'apple'</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">'mango'</tspan><tspan fill="#fbbf24">]</tspan><tspan fill="#e2e8f0">;</tspan>
  </text>

  <!-- Line 4 -->
  <text x="140" y="211" font-family="'Courier New', Courier, monospace" font-size="11">
    <tspan fill="#e2e8f0">fruits.</tspan><tspan fill="#60a5fa">push</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#86efac">'grape'</tspan><tspan fill="#e2e8f0">);</tspan>
    <tspan fill="#4a3570">  // → ['apple','mango','grape']</tspan>
  </text>

  <!-- Line 5: blank -->

  <!-- Line 6 -->
  <text x="140" y="247" font-family="'Courier New', Courier, monospace" font-size="11">
    <tspan fill="#c084fc">const </tspan><tspan fill="#e2e8f0">nums </tspan><tspan fill="#7dd3fc">= </tspan><tspan fill="#fbbf24">[</tspan><tspan fill="#fb923c">3</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#fb923c">1</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#fb923c">4</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#fb923c">1</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#fb923c">5</tspan><tspan fill="#fbbf24">]</tspan><tspan fill="#e2e8f0">;</tspan>
  </text>

  <!-- Line 7 -->
  <text x="140" y="265" font-family="'Courier New', Courier, monospace" font-size="11">
    <tspan fill="#c084fc">const </tspan><tspan fill="#e2e8f0">sorted </tspan><tspan fill="#7dd3fc">= </tspan><tspan fill="#e2e8f0">[...nums].</tspan><tspan fill="#60a5fa">sort</tspan><tspan fill="#e2e8f0">();</tspan>
  </text>

