<svg width="260" height="56" viewBox="0 0 260 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="line1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="line2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="line3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feOffset dx="0" dy="2" in="blur" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Icon mark ── -->

  <!-- Glow behind icon -->
  <rect x="1" y="5" width="48" height="48" rx="13" fill="#7c3aed" opacity="0.35" filter="url(#iconShadow)"/>

  <!-- Icon background -->
  <rect x="0" y="4" width="48" height="48" rx="12" fill="url(#iconGrad)"/>

  <!-- Subtle top highlight -->
  <rect x="0" y="4" width="48" height="24" rx="12" fill="white" opacity="0.05"/>

  <!-- Inner screen -->
  <rect x="6" y="10" width="36" height="36" rx="7" fill="#06000f"/>

  <!-- Title bar -->
  <rect x="6" y="10" width="36" height="11" rx="7" fill="#0e0022"/>
  <rect x="6" y="17"  width="36" height="4" fill="#0e0022"/>

  <!-- Traffic light dots -->
  <circle cx="13" cy="16" r="2.2" fill="#ec4899"/>
  <circle cx="20" cy="16" r="2.2" fill="#f59e0b"/>
  <circle cx="27" cy="16" r="2.2" fill="#10b981"/>

  <!-- Code lines -->
  <rect x="11" y="25" width="22" height="2.5" rx="1.25" fill="url(#line1Grad)" opacity="0.9"/>
  <rect x="11" y="31" width="15" height="2.5" rx="1.25" fill="url(#line2Grad)" opacity="0.8"/>
  <rect x="11" y="37" width="19" height="2.5" rx="1.25" fill="url(#line3Grad)" opacity="0.7"/>

  <!-- Cursor -->
  <rect x="31" y="37" width="2" height="2.5" rx="1" fill="#c084fc">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- ── Wordmark ── -->

  <!-- "Software" -->
  <text
    x="60"
    y="26"
    font-family="Poppins, 'Segoe UI', system-ui, sans-serif"
    font-size="16"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="-0.4"
  >Software</text>

  <!-- "Study Scripts" -->
  <text
    x="61"
    y="44"
    font-family="Poppins, 'Segoe UI', system-ui, sans-serif"
    font-size="13"
    font-weight="400"
    fill="#a78bfa"
    letter-spacing="0.8"
  >Study Scripts</text>

  <!-- Subtle separator dot between the two text lines -->
  <circle cx="56" cy="35" r="1.5" fill="#3d1a6e"/>
</svg>
